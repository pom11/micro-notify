[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-notify"
version = "0.0.1"
description = "CLI for agents and scripts: email from a Microsoft 365 mailbox (Graph app-only) and Teams messages (Workflows webhooks)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "msal>=1.28",
    # Certificate auth signs a JWT client assertion; recent msal no longer
    # pulls cryptography in, so a pip/uv install could not sign it.
    "cryptography>=42",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
micro-notify = "micro_notify.cli:main"
mnotify = "micro_notify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The suite must never touch the network; tests/conftest.py blocks sockets
# autouse (design section 7). Nothing here may add plugins that open sockets.
xfail_strict = true
